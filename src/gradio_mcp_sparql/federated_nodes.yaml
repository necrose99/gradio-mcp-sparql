# federated_nodes.yaml
# Dynamic multi-format serialization lookup matrix for gradio-mcp-sparql 

# =====================================================================
# GRADIO-MCP-SPARQL FEDERATED METADATA MATRIX & AUTHORITY STANDARDS
# =====================================================================

language_metadata:
  target_family: "Algic"
  primary_focus:
    iso_639_3: "mia"                # Individual active language identifier
    glottocode: "miam1252"          # Stable Glottolog languoid key
    wikidata_id: "Q56523"           # Knowledge graph master item entity link
    endonym: "myaamia"              # Native uncapitalized language designation
    authoritative_reconstruction: "Costa 2003"


# Global standardized code ranges for linguistic datasets and schema validation
authority_standards_registry:
  iso_639:
    part_1: "alpha-2 codes for major world languages (e.g., 'en', 'fr', 'it')"
    part_2_B: "alpha-3 bibliographic codes (e.g., 'eng', 'fre', 'ita')"
    part_2_T: "alpha-3 terminological codes (e.g., 'eng', 'fra', 'ita')"
    part_3: "alpha-3 comprehensive coverage of individual languages (e.g., 'mia', 'cre', 'ojw')"
    part_5: "alpha-3 codes for language families and groups (e.g., 'alg' for Algonquian)"
  
  glottolog:
    format: "alph4123 alphanumeric unique stable identifiers"
    macro_areas: ["North America", "South America", "Eurasia", "Africa", "Papunesia", "Australia"]
    genealogical_nodes:
      algic: "algi1248"             # Master family node
      algonquian: "algo1256"        # Core Algonquian branch
      miami_illinois: "miam1252"    # Target dialect cluster node [0.1.9, source: 1]

  bibliographic_and_authority_vectors:
    marc21_language_code: "alg"     # Algonquian languages collective grouping code
    lcsh_authority_id: "sh85084654" # Library of Congress authority record for Miami-Illinois [0.1.9, source: 2]
    wals_code: "ill"                # World Atlas of Language Structures identifier [0.1.9, source: 2]

upstream_linguistic_registries:
  - name: "Glottolog Reference Languoid Master Engine"
    base_url: "https://glottolog.org"
    validation_regex: "^[a-z]{4}[0-9]{4}$"
    format_router_templates:
      base_html: "https://glottolog.org{glottocode}"
      interactive_treeview: "https://glottolog.org{glottocode}.treeview.html"
      turtle_rdf: "https://glottolog.org{glottocode}.ttl"
      triple_nt: "https://glottolog.org{glottocode}.nt"
      xml_rdf: "https://glottolog.org{glottocode}.rdf"
      raw_json: "https://glottolog.org{glottocode}.json"
      newick_phylogenetic: "https://glottolog.org{glottocode}.newick.txt"
      phylo_xml: "https://glottolog.org{glottocode}.phylo.xml"
  - name: "Grambank Language Sheet"
    base_url: "https://clld.org"
    format: "turtle"
  - name: "Wikidata Entity Endpoint"
    base_url: "https://wikidata.org"
    format: "turtle"
  - name: "Endangered Languages Project"
    catalog_id: 1924
    uri: "https://endangeredlanguages.com"
  - name: "SIL ISO 639-3 Documentation"
    base_url: "https://sil.org"
    format: "html"

remote_sparql_endpoints:
  - identifier: "wikidata-main"
    endpoint_url: "https://wikidata.org"
    purpose: "Broad Anthropological and Geographic Ontological Properties"

  - identifier: "kgccc-unito"
    endpoint_url: "https://unito.it"
    purpose: "Cross-Linguistic Translation Mapping (IT/EN)"
    nl_to_sparql_bridge: "liita-nl2sparql"

  - identifier: "nfdi4culture"
    endpoint_url: "https://nfdi4culture.de/sparql"
    purpose: "Cultural Heritage and Humanities Research Knowledge Graphs"

  - identifier: "dbpedia-global"
    endpoint_url: "http://dbpedia.org/sparql"
    interfaces:
      isparql: "http://dbpedia.org/isparql"
      snorql: "http://dbpedia.org/snorql"

  - identifier: "dbpedia-japan"
    endpoint_url: "http://ja.dbpedia.org/sparql"
    purpose: "Regionalized Japanese Language Wiki Extracted Knowledge Graphs"

  - identifier: "cordis-europa"
    endpoint_url: "https://cordis.europa.eu/datalab/sparql-endpoint"
    purpose: "European Commission Research and Development Framework Datasets"

  - identifier: "estat-japan"
    endpoint_url: "http://data.e-stat.go.jp/lod/sparql/alldata/query"
    purpose: "Japanese Government National Census and Economic Statistics LOD Core"
    syntax: "SPARQL 1.1"

  - identifier: "ndl-authorities"
    endpoint_url: "http://id.ndl.go.jp/auth/ndla"
    purpose: "National Diet Library Web Authorities Name/Subject Graphs"

upstream_bulk_dump_directories:
  - name: "DBpedia 2016-10 Link Manifests"
    root_directory: "http://downloads.dbpedia.org/2016-10/links/"
  - name: "DBpedia 2016-10 Core Datasets"
    root_directory: "http://downloads.dbpedia.org/2016-10/core/"
    target_ttl_archives:
      - "http://downloads.dbpedia.org/2016-10/core-i18n/en/instance_types_lhd_dbo_en.ttl.bz2"
      - "http://downloads.dbpedia.org/2016-10/core-i18n/en/instance_types_lhd_ext_en.ttl.bz2"

mcp_server:
  engine: "kolibrie-rust-wrapper"
  plugin_type: "sparql_scaffolding"
  reference_tables:
    - name: "English"
      iso_639_1: "en"
      iso_639_3: "eng"
      sparql_filter: "FILTER(LANG(?obj) = 'en')"
    - name: "Spanish"
      iso_639_1: "es"
      iso_639_3: "spa"
      sparql_filter: "FILTER(LANG(?obj) = 'es')"
    - name: "Mandarin Chinese"
      iso_639_1: "zh"
      iso_639_3: "cmn"
      sparql_filter: "FILTER(LANG(?obj) = 'zh')"
    - name: "Hindi"
      iso_639_1: "hi"
      iso_639_3: "hin"
      sparql_filter: "FILTER(LANG(?obj) = 'hi')"
    - name: "Arabic"
      iso_639_1: "ar"
      iso_639_3: "ara"
      sparql_filter: "FILTER(LANG(?obj) = 'ar')"
    - name: "Japanese"
      iso_639_1: "ja"
      iso_639_3: "jpn"
      sparql_filter: "FILTER(LANG(?obj) = 'ja')"
    - name: "French"
      iso_639_1: "fr"
      iso_639_3: "fra"
      sparql_filter: "FILTER(LANG(?obj) = 'fr')"
    - name: "German"
      iso_639_1: "de"
      iso_639_3: "deu"
      sparql_filter: "FILTER(LANG(?obj) = 'de')"
    - name: "Russian"
      iso_639_1: "ru"
      iso_639_3: "rus"
      sparql_filter: "FILTER(LANG(?obj) = 'ru')"
    - name: "Portuguese"
      iso_639_1: "pt"
      iso_639_3: "por"
      sparql_filter: "FILTER(LANG(?obj) = 'pt')"
    - name: "Latin"
      iso_639_1: "la"
      iso_639_3: "lat"
      sparql_filter: "FILTER(LANG(?obj) = 'la')"
    - name: "Sanskrit"
      iso_639_1: "sa"
      iso_639_3: "san"
      sparql_filter: "FILTER(LANG(?obj) = 'sa')"

